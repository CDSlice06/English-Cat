      '</div>' +
      '<p class="quote-zh">' + esc(s.zh) + '</p>' +
      '<div class="quote-foot">' +
        '<button type="button" class="text-btn" data-action="toggle-quote" data-key="' + esc(k) + '" aria-expanded="' + (shown ? 'true' : 'false') + '">' + (shown ? '收起译文' : '显示译文') + '</button>' +
      '</div>' +
      '<p class="quote-en"' + (shown ? '' : ' hidden') + '>' + esc(s.en) + '</p>' +
      (s.note ? '<p class="quote-note">' + esc(s.note) + '</p>' : '') +
    '</article>';
  }

  function renderQuotes() {
    var q = quoteQuery.trim().toLowerCase();
    var list = sentences.filter(function (s) {
      if (!q) return true;
      return (str(s.zh) + '\n' + str(s.en)).toLowerCase().indexOf(q) >= 0;
    });
    var starred = [];
    var rest = [];
    list.forEach(function (s) {
      if (isStarred(sentenceKey(s))) starred.push(s);
      else rest.push(s);
    });
    var ordered = starred.concat(rest);

    els.quoteCount.textContent = '共 ' + ordered.length + ' 条';
    if (!ordered.length) {
      els.quoteList.innerHTML = emptyBox('没找到，换个关键词试试', '试试换一句中文或英文关键词。');
      return;
    }
    els.quoteList.innerHTML = ordered.map(quoteCardHtml).join('');
  }

  function renderQuotesAndFocus(action, key) {
    renderQuotes();
    requestAnimationFrame(function () {
      var nodes = els.quoteList.querySelectorAll('[data-action]');
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].dataset.action === action && nodes[i].dataset.key === key) {
          nodes[i].focus();
          break;
        }
      }
    });
  }

  function toggleQuoteStar(key) {
    var i = state.starred.indexOf(key);
    if (i >= 0) state.starred.splice(i, 1);
    else state.starred.push(key);
    save();
    renderQuotesAndFocus('toggle-star-quote', key);
    renderPlan();
  }

  /* ---------- 计划 ---------- */

  function groupSchedule(entries) {
    var groups = [];
    var cur = null;
    entries.forEach(function (e) {
      var ymd = fmtYmd(e.date);
      if (!cur || cur.ymd !== ymd) {
        cur = { ymd: ymd, date: e.date, items: [] };
        groups.push(cur);
      }
      cur.items.push(e);
    });
    return groups;
  }

  function renderPlan() {
    var perButtons = els.perdaySeg.querySelectorAll('button[data-perday]');
    Array.prototype.forEach.call(perButtons, function (b) {
      b.setAttribute('aria-pressed', String(Number(b.dataset.perday) === state.plan.perDay));
    });
    els.startDate.value = state.plan.startAt;
    els.reviewToggle.checked = state.plan.review;

    els.statDone.textContent = learnedCount() + '/' + sets.length;
    els.statStreak.textContent = String(streakDays());
    els.statStar.textContent = String(state.starred.length);

    var entries = schedule();
    if (!entries.length) {
      els.scheduleList.innerHTML = '<div class="empty empty--sm">暂无排期</div>';
      els.finishLine.textContent = '';
      return;
    }

    var groups = groupSchedule(entries);
    var todayKey = todayStr();
    els.scheduleList.innerHTML = groups.map(function (g) {
      var isToday = g.ymd === todayKey;
      return '<div class="schedule-row' + (isToday ? ' is-today' : '') + '">' +
        '<span class="sched-date">' + (g.date.getMonth() + 1) + '/' + g.date.getDate() + ' ' + shortWeekday(g.date) + '</span>' +
        '<span class="sched-topics">' + g.items.map(function (i) { return esc(i.s.topic); }).join(' · ') + '</span>' +
        (isToday ? '<span class="today-mark" aria-hidden="true">今</span>' : '') +
      '</div>';
    }).join('');

    var last = groups[groups.length - 1].date;
    els.finishLine.textContent = '预计 ' + (last.getMonth() + 1) + ' 月 ' + last.getDate() + ' 日背完';
  }

  function exportProgress() {
    var payload = {
      app: 'transHandbook',
      version: 1,
      exportedAt: new Date().toISOString(),
      plan: state.plan,
      done: state.done,
      starred: state.starred
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'transHandbook-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('进度已导出');
  }

  function clearProgress() {
    if (!confirm('确定清空所有进度吗？已背记录、收藏和复习记录都会被清除，计划设置保留。')) return;
    state.done = {};
    state.starred = [];
    save();
    renderPlan();
    toast('进度已清空');
  }

  /* ---------- tab 切换 ---------- */

  function renderTab(name) {
    if (name === 'today') renderToday();
    else if (name === 'sets') renderSets();
    else if (name === 'quotes') renderQuotes();
    else if (name === 'plan') renderPlan();
  }

  function switchTab(name) {
    if (!panels[name]) return;
    activeTab = name;
    tabButtons.forEach(function (btn) {
      var on = btn.dataset.tab === name;
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.tabIndex = on ? 0 : -1;
    });
    Object.keys(panels).forEach(function (key) {
      panels[key].hidden = key !== name;
    });
    renderTab(name);
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    try { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
  }

  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
  });

  els.tabbar.addEventListener('keydown', function (e) {
    var keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
    if (keys.indexOf(e.key) < 0) return;
    var i = tabButtons.indexOf(document.activeElement);
    if (i < 0) return;
    var next = 0;
    if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = tabButtons.length - 1;
    else next = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabButtons.length) % tabButtons.length;
    e.preventDefault();
    tabButtons[next].focus();
    switchTab(tabButtons[next].dataset.tab);
  });

  /* ---------- 事件绑定 ---------- */

  els.panelToday.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var key = btn.dataset.key;
    if (btn.dataset.action === 'practice') startDaily(key);
    else if (btn.dataset.action === 'review') startReview(key);
  });

  els.overlay.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (btn) {
      var action = btn.dataset.action;
      if (action === 'close') closePractice();
      else if (action === 'reveal') {
        if (!practice) return;
        practice.revealed = true;
        renderPractice();
        focusIn('.reveal-box');
      } else if (action === 'rate') {
        ratePractice(btn.dataset.result);
      }
      return;
    }
    if (e.target === els.overlay) closePractice();
  });

  els.practiceBody.addEventListener('input', function (e) {
    if (practice && e.target && e.target.id === 'draft-input') {
      practice.draft = e.target.value;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (els.overlay.hidden) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closePractice();
      return;
    }
    if (e.key !== 'Tab') return;
    var nodes = Array.prototype.filter.call(
      els.overlay.querySelectorAll('button:not([disabled]), textarea, a[href], summary, [tabindex]:not([tabindex="-1"])'),
      function (el) { return el.offsetParent !== null; }
    );
    if (!nodes.length) return;
    var first = nodes[0];
    var last = nodes[nodes.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  els.setSearch.addEventListener('input', function () {
    setQuery = els.setSearch.value;
    clearTimeout(setTimer);
    setTimer = setTimeout(renderSets, 120);
  });

  els.levelChips.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-level]');
    if (!btn) return;
    setLevel = btn.dataset.level;
    Array.prototype.forEach.call(els.levelChips.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.level === setLevel));
    });
    renderSets();
  });

  els.setYear.addEventListener('change', function () {
    setYear = els.setYear.value;
    renderSets();
  });

  els.setList.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    var key = btn.dataset.key;

    if (action === 'toggle-set') {
      if (setExpanded.has(key)) setExpanded.delete(key);
      else setExpanded.add(key);
      renderSetsAndFocus('toggle-set', key);
    } else if (action === 'reveal') {
      if (setRevealed.has(key)) setRevealed.delete(key);
      else setRevealed.add(key);
      renderSetsAndFocus('reveal', key);
    } else if (action === 'toggle-done') {
      toggleSetDone(key);
    } else if (action === 'toggle-star-set') {
      toggleSetStar(key);
    }
  });

  els.quoteSearch.addEventListener('input', function () {
    quoteQuery = els.quoteSearch.value;
    clearTimeout(quoteTimer);
    quoteTimer = setTimeout(renderQuotes, 120);
  });

  els.quoteList.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var key = btn.dataset.key;
    if (btn.dataset.action === 'toggle-quote') {
      if (quoteShown.has(key)) quoteShown.delete(key);
      else quoteShown.add(key);
      renderQuotesAndFocus('toggle-quote', key);
    } else if (btn.dataset.action === 'toggle-star-quote') {
      toggleQuoteStar(key);
    }
  });

  els.perdaySeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-perday]');
    if (!btn) return;
    var per = Number(btn.dataset.perday);
    if (per === state.plan.perDay) return;
    state.plan.perDay = per;
    save();
    renderPlan();
    toast('每天 ' + per + ' 套，排期已更新');
  });

  els.startDate.addEventListener('change', function () {
    var v = els.startDate.value;
    if (!parseYmd(v)) {
      els.startDate.value = state.plan.startAt;
      toast('请选择有效的开始日期');
      return;
    }
    state.plan.startAt = v;
    save();
    renderPlan();
    toast('已从 ' + v + ' 重新排期');
  });

  els.reviewToggle.addEventListener('change', function () {
    state.plan.review = els.reviewToggle.checked;
    save();
    renderPlan();
    toast(state.plan.review ? '已开启 1/3/7 天复习' : '已关闭到期复习');
  });

  els.exportBtn.addEventListener('click', exportProgress);
  els.clearBtn.addEventListener('click', clearProgress);

  /* ---------- 启动 ---------- */

  if (!storageOk) showStorageNote();
  renderToday();
  renderSets();
  renderQuotes();
  renderPlan();
})();
</script>
</body>
</html>
