<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>真题翻译小手账</title>
<style>
  :root {
    --paper: #fbf7ef;
    --card: #fffdf8;
    --line: #e6ddc9;
    --ink: #2f5d50;
    --accent: #b4553e;
    --muted: #8a8175;
    --text: #33302a;
    --serif: Georgia, "Songti SC", "STSong", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.65;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(to right, rgba(47, 93, 80, .055) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(to bottom, rgba(47, 93, 80, .055) 0 1px, transparent 1px 24px);
  }

  body.no-scroll { overflow: hidden; }

  h1, h2, h3, h4, p { margin: 0; }

  button, input, select, textarea {
    font: inherit;
    color: inherit;
  }

  button { cursor: pointer; }

  a { color: var(--ink); }

  svg { display: block; }

  [hidden] { display: none !important; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .app {
    max-width: 760px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* 手撕纸页头 */
  .masthead {
    position: relative;
    padding: 28px 20px 38px;
    background: linear-gradient(180deg, #fdfaf3 0%, #f7efdf 100%);
    clip-path: polygon(
      0 0, 100% 0, 100% 93%,
      97% 96%, 94% 92%, 91% 97%, 88% 93%, 85% 98%, 82% 94%,
      79% 97%, 76% 92%, 73% 96%, 70% 93%, 67% 98%, 64% 94%,
      61% 97%, 58% 92%, 55% 96%, 52% 93%, 49% 98%, 46% 94%,
      43% 97%, 40% 92%, 37% 96%, 34% 93%, 31% 98%, 28% 94%,
      25% 97%, 22% 92%, 19% 96%, 16% 93%, 13% 98%, 10% 94%,
      7% 97%, 4% 93%, 0 96%
    );
  }

  .masthead-tape {
    position: absolute;
    top: 13px;
    right: 22px;
    width: 74px;
    height: 18px;
    border-radius: 2px;
    background: rgba(180, 85, 62, .14);
    box-shadow: inset 0 0 0 1px rgba(180, 85, 62, .07);
    transform: rotate(2.4deg);
  }

  .masthead-kicker {
    font-family: var(--serif);
    font-size: 10px;
    letter-spacing: .24em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .masthead h1 {
    margin-top: 7px;
    font-family: var(--serif);
    font-size: 29px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: .05em;
    color: #2c2a24;
  }

  .masthead h1::after {
    content: "";
    display: block;
    width: 106px;
    height: 4px;
    margin-top: 7px;
    border-radius: 60% 40% 55% 45%;
    background: var(--accent);
    opacity: .28;
    transform: rotate(-.7deg);
  }

  .masthead-sub {
    margin-top: 9px;
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--muted);
  }

  main {
    flex: 1;
    padding: 20px 18px calc(108px + env(safe-area-inset-bottom));
  }

  .panel { animation: panelIn .22s ease-out; }

  @keyframes panelIn {
    from { opacity: .35; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    font-size: 10.5px;
    line-height: 1.5;
    letter-spacing: .16em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .day-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin: 2px 2px 16px;
  }

  .day-title {
    margin-top: 3px;
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    line-height: 1.35;
    color: #2c2a24;
    letter-spacing: .02em;
  }

  .day-sub {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .day-dots {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    max-width: 96px;
    padding-top: 26px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border: 1px solid rgba(47, 93, 80, .45);
    border-radius: 50%;
    background: transparent;
  }

  .dot.is-done {
    border-color: var(--ink);
    background: var(--ink);
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 1px 0 rgba(90, 74, 48, .04), 0 9px 18px -14px rgba(90, 74, 48, .55);
  }

  /* 胶带贴纸 */
  .tags {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid rgba(47, 93, 80, .13);
    border-radius: 3px;
    background: rgba(47, 93, 80, .09);
    color: var(--ink);
    font-size: 11px;
    line-height: 1.55;
    letter-spacing: .02em;
    white-space: nowrap;
    transform: rotate(-1.2deg);
  }

  .tags .tag:nth-child(2n) {
    border-color: rgba(180, 85, 62, .15);
    background: rgba(180, 85, 62, .09);
    color: var(--accent);
    transform: rotate(1.3deg);
  }

  .tags .tag:nth-child(3n) { transform: rotate(-.6deg); }

  .tag.tag--done {
    border-color: rgba(47, 93, 80, .3);
    background: rgba(47, 93, 80, .13);
    color: var(--ink);
  }

  .tag.tag--bad {
    border-color: rgba(180, 85, 62, .3);
    background: rgba(180, 85, 62, .13);
    color: var(--accent);
  }

  .tag.tag--star {
    border-color: rgba(180, 85, 62, .28);
    background: rgba(180, 85, 62, .12);
    color: var(--accent);
  }

  .tag.tag--accent {
    border-color: rgba(180, 85, 62, .28);
    background: rgba(180, 85, 62, .12);
    color: var(--accent);
  }

  .tag.tag--soft {
    border-color: rgba(138, 129, 117, .2);
    background: rgba(138, 129, 117, .1);
    color: var(--muted);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 40px;
    padding: 8px 16px;
    border: 1px solid var(--ink);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.2;
    text-align: center;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }

  .btn:active { transform: translateY(1px); }

  .btn--primary {
    background: var(--ink);
    color: #fffdf8;
  }

  .btn--accent {
    border-color: var(--accent);
    background: rgba(180, 85, 62, .08);
    color: var(--accent);
  }

  .btn--ghost {
    border-color: var(--line);
    background: rgba(255, 253, 248, .65);
    color: var(--ink);
  }

  .btn--sm {
    min-height: 34px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 13px;
  }

  .btn--block { width: 100%; }

  @media (hover: hover) {
    .btn--primary:hover { background: #264d42; }
    .btn--accent:hover { background: rgba(180, 85, 62, .15); }
    .btn--ghost:hover { background: rgba(47, 93, 80, .06); }
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    transition: color .18s ease, background .18s ease;
  }

  .icon-btn:hover { background: rgba(47, 93, 80, .06); }

  .star[aria-pressed="true"] { color: var(--accent); }
  .star[aria-pressed="true"] svg { fill: currentColor; }

  /* 今日任务卡 */
  .task-card { padding: 14px 15px 15px; }

  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .task-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .task-topic {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: .03em;
    color: #3a352c;
  }

  .task-card.is-done .task-topic {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }

  .task-excerpt {
    margin: 9px 0 11px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .task-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }

  .task-state {
    flex: 1;
    min-width: 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .stamp {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border: 1px solid rgba(47, 93, 80, .45);
    border-radius: 4px;
    background: rgba(47, 93, 80, .04);
    color: var(--ink);
    font-size: 10.5px;
    line-height: 1.5;
    letter-spacing: .08em;
    transform: rotate(-1.5deg);
  }

  .stamp--bad {
    border-color: rgba(180, 85, 62, .4);
    background: rgba(180, 85, 62, .05);
    color: var(--accent);
  }

  .stamp svg { width: 12px; height: 12px; }

  .today-done {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(47, 93, 80, .055);
    border-style: dashed;
  }

  .today-done .seal-sm {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(47, 93, 80, .35);
    border-radius: 50%;
    color: var(--ink);
    transform: rotate(-4deg);
  }

  .today-done strong {
    display: block;
    font-family: var(--serif);
    font-size: 16px;
    color: var(--ink);
  }

  .today-done p { font-size: 12px; color: var(--muted); }

  .review-block { margin-top: 24px; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin: 0 2px 10px;
  }

  .section-head h3 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--ink);
  }

  .section-head span {
    font-size: 11.5px;
    color: var(--muted);
  }

  .review-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
  }

  .review-main { flex: 1; min-width: 0; }

  .review-title {
    margin-bottom: 6px;
    font-family: var(--serif);
    font-size: 16.5px;
    font-weight: 600;
    color: #3a352c;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    padding: 26px 18px;
    border: 1px dashed #d9cfba;
    border-radius: 14px;
    background: rgba(255, 253, 248, .62);
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.85;
  }

  .empty strong {
    display: block;
    margin-bottom: 5px;
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  .empty--sm {
    padding: 16px;
    font-size: 12.5px;
  }

  /* 题库 */
  .panel-head { margin: 2px 2px 14px; }

  .panel-title {
    margin-top: 3px;
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: .02em;
    color: #2c2a24;
  }

  .panel-sub {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    box-shadow: 0 1px 0 rgba(90, 74, 48, .03);
  }

  .search:focus-within {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(47, 93, 80, .12);
  }

  .search svg { flex: 0 0 auto; color: var(--muted); }

  .search input {
    flex: 1;
    min-width: 0;
    padding: 12px 0;
    border: 0;
    background: transparent;
    font-size: 14px;
    outline-offset: -2px;
  }

  .search input::placeholder { color: #b3aa9b; }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .chip {
    min-height: 36px;
    padding: 5px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 253, 248, .7);
    color: var(--muted);
    font-size: 13px;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }

  .chip[aria-pressed="true"] {
    border-color: var(--ink);
    background: var(--ink);
    color: #fffdf8;
  }

  .select-wrap {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .select-wrap select {
    min-height: 36px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
  }

  .result-count {
    margin: 0 2px 9px;
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .04em;
  }

  .set-card { overflow: hidden; }

  .set-card + .set-card { margin-top: 12px; }

  .card-toggle {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 7px;
    width: 100%;
    padding: 14px 15px 11px;
    border: 0;
    background: transparent;
    text-align: left;
  }

  .set-title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding-right: 26px;
  }

  .set-topic {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: .02em;
    color: #3a352c;
  }

  .set-excerpt {
    padding-right: 26px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .set-caret {
    position: absolute;
    top: 16px;
    right: 12px;
    color: var(--muted);
    transition: transform .2s ease;
  }

  .set-card.is-open .set-caret { transform: rotate(180deg); }

  .set-detail {
    margin: 0 15px;
    padding: 13px 0 0;
    border-top: 1px dashed var(--line);
  }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 12px;
    padding: 10px 15px 13px;
    border-top: 1px dashed var(--line);
  }

  .set-card .card-foot { margin-top: 0; }

  .text-block + .text-block { margin-top: 14px; }

  .text-block h4 {
    margin-bottom: 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .13em;
    color: var(--muted);
  }

  .text-block p {
    font-size: 14.5px;
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }

  .block-head h3,
  .block-head h4 { margin: 0; }

  .text-btn {
    min-height: 28px;
    padding: 2px 0;
    border: 0;
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .en-block .en-text {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.9;
    color: #34514a;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    transition: filter .2s ease;
  }

  .en-block.is-blurred .en-text {
    filter: blur(5px);
    user-select: none;
    pointer-events: none;
  }

  details.diff {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }

  details.diff summary {
    color: var(--accent);
    font-size: 12.5px;
    line-height: 1.5;
    cursor: pointer;
    list-style-position: inside;
    width: fit-content;
  }

  details.diff p {
    margin-top: 7px;
    color: #6d6559;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .source {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }

  .source a {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .src-url {
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }

  .meta-label {
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* 金句 */
  .quote-card { padding: 14px 15px 13px; }

  .quote-card + .quote-card { margin-top: 12px; }

  .quote-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .quote-zh {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.9;
    color: #3a352c;
    letter-spacing: .015em;
  }

  .quote-en {
    margin-top: 10px;
    padding-left: 10px;
    border-left: 2px solid rgba(47, 93, 80, .25);
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.85;
    color: #34514a;
  }

  .quote-foot { margin-top: 8px; }

  .quote-note {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
    line-height: 1.65;
    color: var(--muted);
  }

  /* 计划 */
  .plan-card { padding: 15px; }
  .plan-card + .plan-card { margin-top: 12px; }

  .plan-card h3 {
    margin-bottom: 10px;
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--ink);
  }

  .seg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    padding: 4px;
    border-radius: 12px;
    background: rgba(47, 93, 80, .055);
  }

  .seg button {
    min-height: 40px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    transition: background .18s ease, color .18s ease;
  }

  .seg button[aria-pressed="true"] {
    background: var(--ink);
    color: #fffdf8;
    box-shadow: 0 2px 5px -2px rgba(47, 93, 80, .55);
  }

  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0 1px;
    margin-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 13.5px;
    color: var(--text);
  }

  input[type="date"] {
    min-height: 38px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
  }

  .switch-row { cursor: pointer; }

  .switch {
    position: relative;
    flex: 0 0 auto;
    display: inline-flex;
    width: 44px;
    height: 26px;
  }

  .switch input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  .switch .track {
    position: relative;
    display: block;
    width: 44px;
    height: 26px;
    border-radius: 999px;
    background: #ded5c4;
    transition: background .18s ease;
  }

  .switch .track::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fffdf8;
    box-shadow: 0 1px 3px rgba(70, 58, 38, .28);
    transition: transform .18s ease;
  }

  .switch input:checked + .track { background: var(--ink); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 16px 8px;
  }

  .stat {
    position: relative;
    text-align: center;
    padding: 0 4px;
  }

  .stat + .stat::before {
    content: "";
    position: absolute;
    top: 15%;
    bottom: 15%;
    left: 0;
    width: 1px;
    background: var(--line);
  }

  .stat strong {
    display: block;
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
  }

  .stat span {
    display: block;
    margin-top: 3px;
    font-size: 11.5px;
    letter-spacing: .04em;
    color: var(--muted);
  }

  .schedule {
    max-height: 338px;
    overflow-y: auto;
    padding: 3px 2px;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    overscroll-behavior: contain;
  }

  .schedule-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px;
    border-bottom: 1px dashed rgba(230, 221, 201, .75);
    font-size: 12.5px;
  }

  .schedule-row:last-child { border-bottom: 0; }

  .schedule-row.is-today {
    border-bottom-color: transparent;
    border-radius: 8px;
    background: rgba(47, 93, 80, .075);
  }

  .sched-date {
    flex: 0 0 88px;
    font-family: var(--serif);
    color: var(--ink);
    letter-spacing: .02em;
  }

  .sched-topics {
    flex: 1;
    min-width: 0;
    color: var(--muted);
    line-height: 1.55;
  }

  .is-today .sched-date,
  .is-today .sched-topics { color: var(--ink); }

  .today-mark {
    flex: 0 0 auto;
    display: inline-grid;
    place-items: center;
    width: 19px;
    height: 19px;
    border: 1px solid rgba(180, 85, 62, .4);
    border-radius: 50%;
    color: var(--accent);
    font-size: 10px;
    transform: rotate(-6deg);
  }

  .finish-line {
    margin-top: 10px;
    text-align: right;
    font-family: var(--serif);
    font-size: 13.5px;
    color: var(--accent);
    letter-spacing: .02em;
  }

  .data-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 12px;
  }

  .data-actions .btn { flex: 1 1 130px; }

  .storage-note {
    margin-top: 10px;
    color: var(--accent);
    font-size: 11.5px;
    line-height: 1.6;
  }

  /* 底部 tabbar */
  .tabbar {
    position: fixed;
    left: 50%;
    bottom: calc(8px + env(safe-area-inset-bottom));
    z-index: 30;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    width: calc(100% - 20px);
    max-width: 740px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 253, 248, .97);
    box-shadow: 0 12px 28px -16px rgba(63, 52, 34, .6);
    transform: translateX(-50%);
    backdrop-filter: blur(6px);
  }

  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 7px 2px 6px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--muted);
    font-size: 10.5px;
    line-height: 1.3;
    letter-spacing: .04em;
    transition: background .18s ease, color .18s ease;
  }

  .tab[aria-selected="true"] {
    background: var(--ink);
    color: #fffdf8;
  }

  /* 练习覆盖层 */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(38, 34, 27, .46);
  }

  .sheet {
    position: relative;
    width: 100%;
    max-width: 760px;
    max-height: 92vh;
    max-height: 92dvh;
    overflow-y: auto;
    padding: 8px 18px calc(24px + env(safe-area-inset-bottom));
    border-radius: 20px 20px 0 0;
    background: var(--card);
    box-shadow: 0 -12px 40px rgba(38, 34, 27, .25);
    animation: sheetIn .22s ease-out;
    overscroll-behavior: contain;
  }

  @keyframes sheetIn {
    from { opacity: .55; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 4px;
    border-bottom: 1px dashed var(--line);
  }

  .sheet-step {
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .practice-head { margin-top: 14px; }

  .practice-head .tags { margin-top: 7px; }

  .practice-zh {
    margin: 14px 0 18px;
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    line-height: 1.9;
    letter-spacing: .02em;
    color: #332f27;
    overflow-wrap: break-word;
  }

  .draft {
    display: block;
    width: 100%;
    min-height: 96px;
    margin-bottom: 14px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fffef9;
    font-size: 14px;
    line-height: 1.8;
    resize: vertical;
  }

  .draft::placeholder { color: #b3aa9b; }

  .reveal-box {
    margin-top: 16px;
    padding: 13px 14px;
    border: 1px solid rgba(47, 93, 80, .18);
    border-radius: 12px;
    background: rgba(47, 93, 80, .045);
  }

  .reveal-box:focus-visible { outline-offset: 3px; }

  .reveal-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink);
  }

  .reveal-box .en-text {
    margin-top: 4px;
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.9;
    color: #2f4a43;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .reveal-box details.diff { margin-top: 11px; }

  .eval-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .eval-row .btn { min-height: 46px; }

  .finish {
    padding: 30px 8px 16px;
    text-align: center;
  }

  .finish .seal {
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    margin: 0 auto 15px;
    border: 2px solid rgba(47, 93, 80, .4);
    border-radius: 50%;
    color: var(--ink);
    transform: rotate(-4deg);
  }

  .finish h2 {
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink);
  }

  .finish p {
    max-width: 280px;
    margin: 8px auto 18px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--muted);
  }

  .toast {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    z-index: 80;
    max-width: calc(100% - 40px);
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(47, 93, 80, .96);
    color: #fffdf8;
    font-size: 12.5px;
    line-height: 1.5;
    text-align: center;
    box-shadow: 0 8px 22px -12px rgba(38, 34, 27, .7);
    opacity: 0;
    transform: translate(-50%, -8px);
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }

  .toast.is-on {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (min-width: 700px) {
    .masthead { padding: 30px 30px 40px; }
    main { padding-left: 28px; padding-right: 28px; }
    .overlay { align-items: center; padding: 24px; }
    .sheet {
      border-radius: 18px;
      max-height: 86vh;
      max-height: 86dvh;
      padding-bottom: 24px;
    }
    .practice-zh { font-size: 23px; }
  }

  @media (max-width: 380px) {
    .masthead h1 { font-size: 27px; }
    .day-title, .panel-title { font-size: 22px; }
    .task-topic { font-size: 20px; }
    .sched-date { flex-basis: 80px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <span class="masthead-tape" aria-hidden="true"></span>
    <p class="masthead-kicker">Translation Notebook</p>
    <h1>真题翻译小手账</h1>
    <p class="masthead-sub">48 套真题 · 2022.12—2026.6</p>
  </header>

  <main>

          <p class="eyebrow">今日 · Today</p>
          <h2 id="day-title" class="day-title">今天</h2>
          <p id="day-sub" class="day-sub"></p>
        </div>
        <div id="day-dots" class="day-dots" aria-hidden="true"></div>
      </div>
      <div id="today-list" class="stack"></div>
      <section id="review-block" class="review-block" aria-labelledby="review-title">
        <div class="section-head">
          <h3 id="review-title">到期复习</h3>
          <span id="review-count"></span>
        </div>
        <div id="review-list" class="stack"></div>
      </section>
    </section>

    <section id="panel-sets" class="panel" role="tabpanel" aria-labelledby="tab-sets" hidden>
      <div class="panel-head">
        <p class="eyebrow">题库 · Library</p>
        <h2 class="panel-title">真题题库</h2>
        <p class="panel-sub">先自己翻一遍，再揭开参考译文。</p>
      </div>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6 20 20"/></svg>
          <span class="sr-only">搜索题库</span>
          <input id="set-search" type="search" placeholder="搜题材、原文或英文…" autocomplete="off" />
        </label>
        <div class="filter-row">
          <div id="level-chips" class="chips" role="group" aria-label="按等级筛选">
            <button type="button" class="chip" data-level="all" aria-pressed="true">全部</button>
            <button type="button" class="chip" data-level="四级" aria-pressed="false">四级</button>
            <button type="button" class="chip" data-level="六级" aria-pressed="false">六级</button>
          </div>
          <label class="select-wrap">
            <span>年份</span>
            <select id="set-year">
              <option value="">全部年份</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
            </select>
          </label>
        </div>
      </div>
      <p id="set-count" class="result-count" aria-live="polite"></p>
      <div id="set-list" class="list"></div>
    </section>

    <section id="panel-quotes" class="panel" role="tabpanel" aria-labelledby="tab-quotes" hidden>
      <div class="panel-head">
        <p class="eyebrow">金句 · Lines</p>
        <h2 class="panel-title">翻译金句</h2>
        <p class="panel-sub">一句一句对照着看，收藏喜欢的表达。</p>
      </div>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6 20 20"/></svg>
          <span class="sr-only">搜索金句</span>
          <input id="quote-search" type="search" placeholder="搜中文或英文…" autocomplete="off" />
        </label>
      </div>
      <p id="quote-count" class="result-count" aria-live="polite"></p>
      <div id="quote-list" class="list"></div>
    </section>

    <section id="panel-plan" class="panel" role="tabpanel" aria-labelledby="tab-plan" hidden>
      <div class="panel-head">
        <p class="eyebrow">计划 · Plan</p>
        <h2 class="panel-title">背记计划</h2>
        <p class="panel-sub">把 48 套切成每天能完成的小份。</p>
      </div>

      <div class="card plan-card">
        <h3>每日套数</h3>
        <div id="perday-seg" class="seg" role="group" aria-label="每日套数">
          <button type="button" data-perday="1" aria-pressed="false">1 套</button>
          <button type="button" data-perday="2" aria-pressed="true">2 套</button>
          <button type="button" data-perday="3" aria-pressed="false">3 套</button>
          <button type="button" data-perday="4" aria-pressed="false">4 套</button>
        </div>
        <label class="field" for="start-date">
          <span>开始日期</span>
          <input id="start-date" type="date" />

          <span class="switch">
            <input id="review-toggle" type="checkbox" />
            <span class="track" aria-hidden="true"></span>
          </span>

      </div>

      <div class="card stats">
        <div class="stat">
          <strong id="stat-done">0/48</strong>
          <span>已背</span>
        </div>
        <div class="stat">
          <strong id="stat-streak">0</strong>
          <span>连续打卡</span>
        </div>
        <div class="stat">
          <strong id="stat-star">0</strong>
          <span>收藏</span>
        </div>

      <div class="card plan-card">
        <h3>排期表</h3>

        <p id="finish-line" class="finish-line"></p>
      </div>

      <div class="card plan-card">
        <h3>进度备份</h3>
        <div class="data-actions">
          <button type="button" id="export-btn" class="btn btn--ghost">导出进度</button>
          <button type="button" id="clear-btn" class="btn btn--accent">清空进度</button>
        </div>
        <p id="storage-note" class="storage-note" hidden>浏览器存储不可用，本次进度只保留在当前页面。</p>
      </div>
    </section>
  </main>
</div>

    <span>题库</span>
  </button>
  <button type="button" class="tab" id="tab-quotes" role="tab" data-tab="quotes" aria-controls="panel-quotes" aria-selected="false" tabindex="-1">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.8 6.2H6.1A1.9 1.9 0 0 0 4.2 8.1v3.2c0 1 .9 1.9 1.9 1.9h2.2v.5c0 1.6-1 2.7-2.6 3.2"/><path d="M19.8 6.2h-3.7a1.9 1.9 0 0 0-1.9 1.9v3.2c0 1 .9 1.9 1.9 1.9h2.2v.5c0 1.6-1 2.7-2.6 3.2"/></svg>
    <span>金句</span>
  </button>
  <button type="button" class="tab" id="tab-plan" role="tab" data-tab="plan" aria-controls="panel-plan" aria-selected="false" tabindex="-1">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4M7.5 14h3M13.5 14h3M7.5 17h3"/></svg>

<div id="practice-overlay" class="overlay" hidden>
  <div class="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="practice-title">
